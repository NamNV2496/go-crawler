  #         cd ../crawler-service && test -z "$(gofmt -l .)"

  # Unit Tests
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: crawler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests - Scheduler Service
        run: |
          cd scheduler-service
          go test -v -race -short -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Run tests - Crawler Service
        run: |
          cd crawler-service
          go test -v -race -short -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

  # Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Scheduler Service
        run: |
          cd scheduler-service
          go build -v -o bin/scheduler main.go

      - name: Build Crawler Service
        run: |
          cd crawler-service
          go build -v -o bin/crawler main.go

      - name: Upload artifacts - Scheduler
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-binary
          path: scheduler-service/bin/scheduler
          retention-days: 7

      - name: Upload artifacts - Crawler
        uses: actions/upload-artifact@v4
        with:
          name: crawler-binary
          path: crawler-service/bin/crawler
          retention-days: 7

  # Docker Build
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Scheduler Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./scheduler-service
          file: ./scheduler-service/Dockerfile
          push: false
          tags: go-crawler/scheduler:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Crawler Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./crawler-service
          file: ./crawler-service/Dockerfile
          push: false
          tags: go-crawler/crawler:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

